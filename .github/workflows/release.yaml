name: macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.4.0-beta.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F '"' '/^version =/{print $2; exit}' pyproject.toml)
          EXPECTED="v$(printf '%s' "$VERSION" | sed -E 's/b([0-9]+)$/-beta.\1/')"
          test "$RELEASE_TAG" = "$EXPECTED"
      - name: Test native policy and history
        run: ./scripts/test-macos.sh
      - name: Package application and corresponding source
        run: ./scripts/package-macos.sh
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/* \
            --verify-tag --draft --prerelease \
            --title "Battery Tool Plus $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
