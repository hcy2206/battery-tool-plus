name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # clang-format is pure syntax, so it runs cheaply on Linux.
  # (clang-tidy and the C tests must stay on macOS: the sources include
  # IOKit headers and meson.build errors out on non-Darwin hosts.)
  c-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check C formatting
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "21"
          check-path: c
          # mirror the justfile: top-level c/ only, third-party smc.c/smc.h excluded
          include-regex: "c/[^/]+\\.(c|h)$"
          exclude-regex: "smc\\.(c|h)$"

  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --all-groups --no-install-project
          uv sync --all-groups

      - name: Run lint
        run: uv run ruff check src/batterytool

      - name: Run format check
        run: uv run ruff format --check src/batterytool

      - name: Run type check
        run: uv run basedpyright

      - name: Run Python tests
        run: uv run pytest

      # latest prebuilt LLVM available for darwin/arm64; warnings only, never fails the job
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1.8"

      # New C sources must be added to this list (third-party smc.c/smc.h stay excluded)
      # -isysroot is required: the prebuilt LLVM can't auto-locate the macOS SDK
      - name: Lint C code
        run: clang-tidy --extra-arg=-isysroot --extra-arg="$(xcrun --show-sdk-path)" c/power_sources.c c/power_sources_fake.c c/smc_fake.c c/smc_wrapper.c c/power_sources.h c/smc_wrapper.h

      - name: Run C tests
        run: |
          uv run meson setup builddir --native-file native-macos.ini
          uv run meson compile -C builddir
          uv run meson test -C builddir --no-suite hardware

      # /usr/bin explicitly: install-llvm-action puts its clang first on PATH,
      # and meson.build requires Apple Clang
      - name: Build wheel
        run: uv build --no-config --wheel
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test native policy and history
        run: ./scripts/test-macos.sh
      - name: Test demo controller, IPC, worker lifetime and view rendering
        run: ./scripts/test-macos-integration.sh
      - name: Build native management app
        run: ./scripts/build-macos.sh
